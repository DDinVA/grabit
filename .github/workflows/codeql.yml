name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday 07:23 UTC — weekly rescan catches new advisories against
    # code that has not changed.
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [swift]

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.30.10
        with:
          languages: ${{ matrix.language }}
          # security-and-quality catches more than the default security-only pack.
          queries: security-and-quality

      - name: Install CocoaPods
        run: pod install

      - name: Build for CodeQL
        run: |
          xcodebuild -workspace ocr.xcworkspace \
            -scheme ocr \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.30.10
        with:
          category: "/language:${{ matrix.language }}"
