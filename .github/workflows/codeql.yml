name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday 07:23 UTC — weekly rescan catches new advisories against
    # code that has not changed.
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [swift]

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3.30.10
        with:
          languages: ${{ matrix.language }}
          # security-and-quality catches more than the default security-only pack.
          queries: security-and-quality

      - name: Install CocoaPods
        run: pod install

      - name: Build for CodeQL
        run: |
          xcodebuild -workspace ocr.xcworkspace \
            -scheme ocr \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3.30.10
        with:
          category: "/language:${{ matrix.language }}"
